<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Loading Images</title>
    <link rel="stylesheet" href="./styles/lazyload.css">
    <script src="./scripts/lazyload.js" defer></script>
</head>

<body>
    <main>
        <div class="title">
            <h1>LAZYLOADING IMAGES</h1>
        </div>

        <div class="images">
            <img src="images/cellphone.webp" alt="cellphone" loading="lazy" width="400" height="600">
            <img src="images/coding-team.webp" alt="coding team" loading="lazy" width="400" height="600">
            <img src="images/holding-phone.webp" alt="holding phone" loading="lazy" width="400" height="600">
            <img src="images/learning-code-is-fun.webp" alt="Students learning coding" loading="lazy" width="400"
                height="600">
            <img src="images/learning.webp" alt="students learning" loading="lazy" width="400" height="600">
            <img src="images/mobile.webp" alt="Mobile Phone" loading="lazy" width="400" height="600">
            <img src="images/school-desks-chairs.webp" alt="School desks and Chairs" loading="lazy" width="400"
                height="600">
            <img src="images/students.webp" alt="Students learning" loading="lazy" width="400" height="600">
            <img src="images/typing-code.webp" alt="Student Typing Code" loading="lazy" width="400" height="600">
            <img src="images/welcoming-summer.webp" alt="Welcome to Summer" loading="lazy" width="400" height="600">
        </div>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> Moses Olagbami | Nigeria
        </p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
