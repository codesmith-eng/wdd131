<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Dynamic Web Fundamentals - Moses Olagbami</title>
    <meta name="description" content="Following form best practises - WDD 131 - OLAGBAMI MOSES">
    <meta name="author" content="Moses Olagbami Ayobami">
    <link rel="stylesheet" href="./styles/form.css">
    <script src="./scripts/form.js" defer></script>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="myform">

            <label for="product">Product Name</label>
            <select name="product" id="product" required>
                <option disabled selected>Choose a Product &#9662;</option>
            </select>


            <div class="rate">Overall Rating</div>
            <div class="stars">
                <input type="radio" id="fivestar" name="stars" value="5" required><label for="fivestar"></label>
                <input type="radio" id="fourstar" name="stars" value="4" required><label for="fourstar"></label>
                <input type="radio" id="threestar" name="stars" value="3" required><label for="threestar"></label>
                <input type="radio" id="twostar" name="stars" value="2" required><label for="twostar"></label>
                <input type="radio" id="onestar" name="stars" value="1" required><label for="onestar"></label>
            </div>

            <label>Date of Installation<input type="date" name="installdate" required></label>

            <div class="feature">Which features did you find useful in the product?</div>
            <div class="italize">(Check all that apply)</div>
            <label><input type="checkbox" name="durable" value="yes">Durability</label>
            <label><input type="checkbox" name="Ease" value="yes">Ease of Use</label>
            <label><input type="checkbox" name="performance" value="yes">Performance</label>
            <label><input type="checkbox" name="design" value="yes">Design</label>

            <label for="feedback">Written Review <span class="optional">(Optional)</span></label>
            <textarea id="feedback" name="feedback"></textarea>

            <label for="fullname">Your Name <span class="optional">(Optional)</span></label>
            <input type="text" id="fullname" name="fullname">

            <input type="submit" value="Post My Review">
            </for>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> Moses Olagbami | Nigeria
        </p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
